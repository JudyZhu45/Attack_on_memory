[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-ctf"
version = "0.1.0"
description = "CTF-style challenges for testing agent memory system robustness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "mem0ai",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
    "pydantic>=2",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-requests",
]

[tool.setuptools]
packages = ["targets", "attacks", "defenses", "experiments", "scripts", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
